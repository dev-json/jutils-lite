server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/jutils_lite
    username: jutils_user
    password: secret
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect
