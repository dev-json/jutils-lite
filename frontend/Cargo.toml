[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wasm-bindgen = "0.2.100"
yew = "0.21.0"
serde = { version = "1", features = ["derive"] }
gloo-net = "0.6.0"
web-sys = { version = "0.3", features = ["Window", "HtmlInputElement"] }